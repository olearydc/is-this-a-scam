# Serves the page with nginx inside the Docker image (used by Coolify).

# Usage counter: one line per event, holding only the time and the kind of event
# (no address, no browser details, never any message text).
log_format counts '$time_iso8601 $uri';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No access log: a message shared from another app arrives in the address (?text=...)
    # on a first visit, and it must never be written down anywhere.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/manifest+json image/svg+xml;

    # Nothing loads from other websites, so the policy can be strict.
    # wasm-unsafe-eval and blob: are for the screenshot reader (tesseract.js).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The page and the offline helper must always be fresh, so updates arrive straight away.
    location = /index.html { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always; add_header Referrer-Policy "no-referrer" always; add_header X-Content-Type-Options "nosniff" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }

    location = /manifest.webmanifest { default_type application/manifest+json; add_header X-Content-Type-Options "nosniff" always; }

    # Fonts and the screenshot reader never change under the same name.
    location ~ ^/(fonts|ocr)/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options "nosniff" always; }

    # The page sends a tiny "a check was done, result X" ping here. Only these names are counted.
    location ~ ^/count/(check-high|check-mid|check-none|quiz|leaflet)$ {
        access_log /var/log/counts/counts.log counts;
        add_header Cache-Control "no-store" always;
        return 204;
    }
    location = /stats.json { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }

    # Only the site's own files exist; anything else is not found.
    location / { try_files $uri $uri/ =404; }
}
