<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Is This a Scam? Usage</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url(fonts/atkinson-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url(fonts/atkinson-700-latin.woff2) format('woff2'); }
:root { --ink: #14222b; --muted: #475c68; --accent: #1b6886; --tint: #eef3f6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--tint); color: var(--ink); font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.8rem; margin: 0 0 4px; }
.muted { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
.tile { background: #fff; border-radius: 12px; padding: 14px 16px; }
.tile b { display: block; font-size: 1.9rem; }
.tile span { color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #dfe7ec; }
th:first-child, td:first-child { text-align: left; }
.wrap { overflow-x: auto; }
a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Usage</h1>
  <p class="muted" id="updated">Loading…</p>
  <div class="tiles" id="tiles"></div>
  <h2>Last 30 days</h2>
  <div class="wrap"><table>
    <thead><tr><th>Day</th><th>Checks</th><th>Very likely scam</th><th>Suspicious</th><th>No signs</th><th>Quiz rounds</th><th>Leaflets</th></tr></thead>
    <tbody id="days"></tbody>
  </table></div>
  <p class="muted">Only counts are kept: the time and the kind of result. No messages, addresses or anything about the person. Example messages and automated tests are not counted.</p>
  <p><a href="./">Back to the scam checker</a></p>
</main>
<script>
function n(x) { return Number(x || 0).toLocaleString("en-IE"); }
function cell(t) { var td = document.createElement("td"); td.textContent = t; return td; }
fetch("stats.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
  document.getElementById("updated").textContent = "Updated " + new Date(s.updated).toLocaleString("en-IE") + " (every 10 minutes)";
  [["Messages checked", s.checks], ["Very likely scams", s.likelyScam], ["Suspicious", s.suspicious], ["No obvious signs", s.noSigns], ["Quiz rounds", s.quizRounds], ["Leaflets printed", s.leafletPrints]].forEach(function (t) {
    var d = document.createElement("div"); d.className = "tile";
    var b = document.createElement("b"); b.textContent = n(t[1]);
    var sp = document.createElement("span"); sp.textContent = t[0];
    d.appendChild(b); d.appendChild(sp); document.getElementById("tiles").appendChild(d);
  });
  s.days.slice().reverse().forEach(function (d) {
    var tr = document.createElement("tr");
    [d.date, n(d["check-high"] + d["check-mid"] + d["check-none"]), n(d["check-high"]), n(d["check-mid"]), n(d["check-none"]), n(d.quiz), n(d.leaflet)].forEach(function (v) { tr.appendChild(cell(v)); });
    document.getElementById("days").appendChild(tr);
  });
}).catch(function () { document.getElementById("updated").textContent = "No numbers yet."; });
</script>
</body>
</html>
